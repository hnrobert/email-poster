name: Publish

# Publish to the npm registry when a version tag (`v*`) is pushed, or manually.
#
# Usage:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Requires the repo secret `NPM_TOKEN` (an npm access/automation token with
# publish rights for `email-poster`). `id-token: write` enables npm provenance,
# which attests the build to its source — recommended for public packages.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for `npm publish --provenance`

concurrency:
  group: npm-publish
  cancel-in-progress: false   # never interrupt a publish mid-flight

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json `packageManager` (pnpm@11.13.0);
      # passing `version` here conflicts and throws ERR_PNPM_BAD_PM_VERSION.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # `prepublishOnly` runs `pnpm build && chmod +x dist/cli.js` automatically,
      # so the tarball (dist + .agents + README/LICENSE/CHANGELOG) is fresh.
      - name: Publish
        run: npm publish --access public --provenance
